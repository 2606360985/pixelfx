<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>街头双响 · Visual QA</title>
<style>body{background:#132b29;color:#ead3a3;font:14px system-ui;margin:24px}main{max-width:1100px;margin:auto}header{display:flex;align-items:center;gap:16px;margin:12px 0}h1{font-size:20px;margin:0 16px 0 0}select,button,input{font:inherit;background:#304b3c;color:#ead3a3;border:1px solid #75815b;padding:6px}#stage{display:block;width:960px;max-width:100%;image-rendering:pixelated;border:1px solid #75815b}output{display:block;margin:12px 0;font:13px monospace}label{white-space:nowrap}.portraits{display:flex;gap:16px}.portraits canvas{width:100px;height:150px;image-rendering:pixelated;background:#28473a}</style>
<main><header><h1>街头双响 · 视觉检查</h1><label>街区 <select id="zone"><option value="0">街口</option><option value="1">瓜摊</option><option value="2">不夜城</option></select></label><label>角色 <select id="hero"></select></label><label>技能 <select id="move"></select></label></header>
<canvas id="stage" width="480" height="270"></canvas><header><label>时刻 <input id="time" type="range" min="0" max="1.8" step=".02" value=".42"></label><button id="replay">重播</button><button id="freeze">定格</button><button id="benchmark">30 秒模拟帧耗时检查</button><button id="overview">16 技能总览</button><button id="streets">三街区总览</button></header><output id="report">静态预览</output><div class="portraits" id="portraits"></div><div id="overview-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:20px 0"></div></main>
<script type="module" src="visual.mjs"></script></html>
